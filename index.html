<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketches</title>
  <meta name="description" content="Weekly creative-coding sketches: WebGPU, shaders, motion, layout." />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #ededea;
      --muted: #8a8a86;
      --line: #1f1f21;
      --accent: #c8ff5a;
      --serif: "Instrument Serif", ui-serif, Georgia, serif;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body {
      font: 400 15px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: clamp(32px, 8vw, 96px) clamp(20px, 5vw, 48px); }
    header { margin-bottom: clamp(40px, 8vw, 88px); }
    .eyebrow {
      font: 400 11px/1 var(--mono);
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }
    h1 {
      font: 400 clamp(64px, 14vw, 148px)/.9 var(--serif);
      letter-spacing: -.02em; margin: 18px 0 20px;
    }
    h1 em { color: var(--muted); }
    .lede { max-width: 44ch; color: var(--muted); margin: 0; }
    ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    li a {
      display: grid; grid-template-columns: 64px 1fr auto; gap: 8px 24px;
      align-items: baseline; padding: 22px 0; color: inherit; text-decoration: none;
      transition: padding .25s ease, color .25s ease;
    }
    li a:hover, li a:focus-visible { padding-left: 12px; outline: none; }
    li a:hover .title, li a:focus-visible .title { color: var(--accent); }
    .num { font: 400 12px/1 var(--mono); color: var(--muted); }
    .title { font: 400 clamp(26px, 4vw, 36px)/1.1 var(--serif); transition: color .25s ease; }
    .desc { grid-column: 2 / 3; color: var(--muted); font-size: 14px; max-width: 56ch; }
    .meta { font: 400 11px/1.6 var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
    .tags { display: block; opacity: .7; }
    .state { padding: 22px 0; color: var(--muted); font: 400 12px/1.6 var(--mono); }
    footer {
      margin-top: 64px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      font: 400 11px/1.6 var(--mono); color: var(--muted); letter-spacing: .04em;
    }
    footer a { color: inherit; }
    @media (max-width: 560px) {
      li a { grid-template-columns: 40px 1fr; }
      .meta { grid-column: 2 / 3; text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Creative coding / weekly</div>
      <h1>Sketches<em>.</em></h1>
      <p class="lede">Small experiments in WebGPU, shaders, WebGL, motion and layout. One folder per sketch, shipped every week.</p>
    </header>

    <ol id="list" aria-live="polite"><li class="state">Loading…</li></ol>

    <footer>
      <span id="count"></span>
      <a href="https://github.com/amedinamv/sketches">github.com/amedinamv/sketches</a>
    </footer>
  </main>

  <script type="module">
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    try {
      const res = await fetch('/sketches.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      const sketches = (await res.json()).slice().sort((a, b) => b.slug.localeCompare(a.slug));

      list.innerHTML = sketches.length ? sketches.map(s => {
        const num = s.slug.split('-')[0];
        const title = s.title || s.slug.replace(/^\d+-/, '').replace(/-/g, ' ');
        return `<li><a href="/sketches/${encodeURIComponent(s.slug)}/">
          <span class="num">${esc(num)}</span>
          <span class="title">${esc(title)}</span>
          <span class="meta">${esc(s.date || '')}<span class="tags">${esc((s.tags || []).join(' · '))}</span></span>
          ${s.description ? `<span class="desc">${esc(s.description)}</span>` : ''}
        </a></li>`;
      }).join('') : '<li class="state">No sketches yet.</li>';

      count.textContent = `${sketches.length} sketch${sketches.length === 1 ? '' : 'es'}`;
    } catch (err) {
      list.innerHTML = `<li class="state">Could not load sketches.json (${esc(err.message)})</li>`;
    }
  </script>
</body>
</html>
