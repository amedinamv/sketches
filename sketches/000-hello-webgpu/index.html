<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>000 · Hello WebGPU · Sketches</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0c'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0c; color: #ededea; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    .hud {
      position: fixed; left: 20px; bottom: 18px; right: 20px; display: flex; justify-content: space-between; gap: 16px;
      font: 400 11px/1.6 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em;
      color: rgba(237, 237, 234, .7); pointer-events: none; mix-blend-mode: difference;
    }
    .hud a { color: inherit; pointer-events: auto; text-decoration: none; }
    .hud a:hover { text-decoration: underline; }
    .notice {
      position: fixed; top: calc(18px + 36px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); max-width: min(90vw, 520px);
      padding: 10px 14px; border: 1px solid #2a2a2c; border-radius: 8px; background: rgba(11, 11, 12, .85);
      font: 400 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: #bdbdb8; text-align: center;
    }
    .notice[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="notice" id="notice" hidden></div>
  <div class="hud">
    <a href="/">← sketches</a>
    <span>000 · hello webgpu · <span id="backend">…</span></span>
  </div>

  <script type="module">
    const canvas = document.getElementById('c');
    const notice = document.getElementById('notice');
    const backendLabel = document.getElementById('backend');
    const say = (msg) => { notice.textContent = msg; notice.hidden = false; };
    const DPR = () => Math.min(window.devicePixelRatio || 1, 2);

    function fit() {
      const w = Math.max(1, Math.floor(canvas.clientWidth * DPR()));
      const h = Math.max(1, Math.floor(canvas.clientHeight * DPR()));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    }

    // ---------------------------------------------------------------- WebGPU
    const WGSL = /* wgsl */ `
      struct U { res: vec2f, time: f32, pad: f32 };
      @group(0) @binding(0) var<uniform> u: U;

      @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var p = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
        return vec4f(p[i], 0.0, 1.0);
      }

      fn palette(t: f32) -> vec3f {
        // soft, cool-to-acid palette
        return vec3f(0.5) + vec3f(0.5) * cos(6.28318 * (vec3f(1.0, 1.0, 0.5) * t + vec3f(0.80, 0.90, 0.30)));
      }

      @fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
        let frag = vec2f(pos.x, u.res.y - pos.y);            // flip to y-up
        let uv0 = (frag * 2.0 - u.res) / min(u.res.x, u.res.y);
        var uv = uv0;
        var col = vec3f(0.0);
        let t = u.time * 0.35;
        for (var i = 0; i < 4; i++) {
          uv = fract(uv * 1.5) - 0.5;
          var d = length(uv) * exp(-length(uv0));
          let c = palette(length(uv0) + f32(i) * 0.4 + t);
          d = abs(sin(d * 8.0 + t * 2.0) / 8.0);
          d = pow(0.01 / max(d, 1e-4), 1.2);
          col += c * d;
        }
        let vignette = smoothstep(1.8, 0.2, length(uv0));
        return vec4f(col * vignette, 1.0);
      }
    `;

    async function startWebGPU() {
      if (!('gpu' in navigator)) return false;
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return false;
      const device = await adapter.requestDevice();
      const ctx = canvas.getContext('webgpu');
      if (!ctx) return false;
      const format = navigator.gpu.getPreferredCanvasFormat();
      ctx.configure({ device, format, alphaMode: 'opaque' });

      const module = device.createShaderModule({ code: WGSL });
      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module, entryPoint: 'vs' },
        fragment: { module, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });
      const ubo = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      const bind = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: ubo } }],
      });
      const data = new Float32Array(4);

      device.lost.then((info) => { if (info.reason !== 'destroyed') say('WebGPU device lost: ' + info.message); });

      const t0 = performance.now();
      function frame(now) {
        fit();
        data[0] = canvas.width; data[1] = canvas.height; data[2] = (now - t0) / 1000;
        device.queue.writeBuffer(ubo, 0, data);
        const enc = device.createCommandEncoder();
        const pass = enc.beginRenderPass({
          colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
        });
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bind);
        pass.draw(3);
        pass.end();
        device.queue.submit([enc.finish()]);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      backendLabel.textContent = 'webgpu';
      return true;
    }

    // ------------------------------------------------------ WebGL2 fallback
    const GLSL_VS = `#version 300 es
      void main() {
        vec2 p = vec2[3](vec2(-1.0, -3.0), vec2(-1.0, 1.0), vec2(3.0, 1.0))[gl_VertexID];
        gl_Position = vec4(p, 0.0, 1.0);
      }`;
    const GLSL_FS = `#version 300 es
      precision highp float;
      uniform vec2 res; uniform float time;
      out vec4 outColor;
      vec3 palette(float t) {
        return vec3(0.5) + vec3(0.5) * cos(6.28318 * (vec3(1.0, 1.0, 0.5) * t + vec3(0.80, 0.90, 0.30)));
      }
      void main() {
        vec2 uv0 = (gl_FragCoord.xy * 2.0 - res) / min(res.x, res.y);
        vec2 uv = uv0; vec3 col = vec3(0.0); float t = time * 0.35;
        for (int i = 0; i < 4; i++) {
          uv = fract(uv * 1.5) - 0.5;
          float d = length(uv) * exp(-length(uv0));
          vec3 c = palette(length(uv0) + float(i) * 0.4 + t);
          d = abs(sin(d * 8.0 + t * 2.0) / 8.0);
          d = pow(0.01 / max(d, 1e-4), 1.2);
          col += c * d;
        }
        outColor = vec4(col * smoothstep(1.8, 0.2, length(uv0)), 1.0);
      }`;

    function startWebGL2() {
      const gl = canvas.getContext('webgl2');
      if (!gl) return false;
      const sh = (type, src) => {
        const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, GLSL_VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, GLSL_FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      gl.bindVertexArray(gl.createVertexArray());
      const uRes = gl.getUniformLocation(prog, 'res');
      const uTime = gl.getUniformLocation(prog, 'time');
      const t0 = performance.now();
      function frame(now) {
        fit();
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uTime, (now - t0) / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      backendLabel.textContent = 'webgl2 fallback';
      return true;
    }

    // ---------------------------------------------------------------- boot
    let ok = false;
    try { ok = await startWebGPU(); } catch (e) { console.warn('WebGPU init failed:', e); }
    if (!ok) {
      let fallback = false;
      try { fallback = startWebGL2(); } catch (e) { console.warn('WebGL2 init failed:', e); }
      say(fallback
        ? 'WebGPU is not supported in this browser — showing the WebGL2 fallback. Try Chrome, Edge, or Safari 26+ for WebGPU.'
        : 'Neither WebGPU nor WebGL2 is available in this browser, so this sketch cannot run here.');
      if (!fallback) backendLabel.textContent = 'unsupported';
    }
  </script>
  <script src="/shared/frame.js"></script>
</body>
</html>
