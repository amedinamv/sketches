<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>001 · Hi-Vis After Dark · Sketches</title>
  <meta name="description" content="A headlamp in the dark. Retroreflective lettering stays dull grey until the beam lines up with your eye." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #ededea;
      --muted: #8a8a86;
      --line: #1f1f21;
      --accent: #c8ff5a;
      --serif: "Instrument Serif", ui-serif, Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body { cursor: crosshair; }
    canvas { display: block; touch-action: none; }
    a, .panel, .panel *, #panel-toggle { cursor: default; }
    .panel, .panel *, #panel-toggle { touch-action: auto; -webkit-user-select: auto; user-select: auto; }
    #panel-toggle {
      display: none;
      position: fixed; z-index: 4;
      top: calc(12px + var(--safe-top) + 36px);
      left: calc(12px + var(--safe-left));
      margin: 0; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 999px;
      background: rgba(11, 11, 12, .82); backdrop-filter: blur(10px);
      color: var(--fg); font: 400 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    }
    #panel-toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    .panel {
      position: fixed; z-index: 2;
      top: calc(16px + var(--safe-top) + 36px);
      left: calc(16px + var(--safe-left));
      width: min(272px, calc(100vw - 32px - var(--safe-left) - var(--safe-right)));
      padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 10px;
      background: rgba(11, 11, 12, .78); backdrop-filter: blur(10px);
      font: 400 11px/1.45 var(--mono); letter-spacing: .02em; color: var(--fg);
    }
    .eyebrow {
      margin: 0 0 2px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-size: 10px;
    }
    .panel h2 {
      margin: 0 0 12px; font: 400 28px/1 var(--serif); letter-spacing: -.02em;
    }
    .panel label { display: block; margin: 0 0 10px; color: var(--muted); }
    .panel label span { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .panel output { color: var(--fg); font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 18px;
      margin: 0; background: transparent;
    }
    input[type="range"]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: #2a2a2c; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border: 0; border-radius: 50%;
      background: var(--accent);
    }
    input[type="range"]::-moz-range-track { height: 2px; background: #2a2a2c; border: 0; }
    input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--accent); }
    .hint { margin: 2px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .hud {
      position: fixed; z-index: 2;
      left: calc(20px + var(--safe-left));
      bottom: calc(18px + var(--safe-bottom));
      right: calc(20px + var(--safe-right));
      display: flex; justify-content: space-between; gap: 16px;
      font: 400 11px/1.6 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em;
      color: rgba(237, 237, 234, .7); pointer-events: none; mix-blend-mode: difference;
    }
    .hud a { color: inherit; pointer-events: auto; text-decoration: none; cursor: pointer; }
    .hud a:hover { text-decoration: underline; }
    .notice {
      position: fixed; z-index: 5;
      top: calc(18px + var(--safe-top) + 36px);
      left: 50%; transform: translateX(-50%); max-width: min(90vw, 560px);
      padding: 10px 14px; border: 1px solid #2a2a2c; border-radius: 8px; background: rgba(11, 11, 12, .9);
      font: 400 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: #bdbdb8; text-align: center;
    }
    .notice[hidden] { display: none; }
    @media (max-width: 960px), (pointer: coarse) {
      #panel-toggle { display: block; }
      .panel {
        display: none;
        top: calc(52px + var(--safe-top) + 36px);
        left: calc(12px + var(--safe-left));
        max-height: min(62dvh, calc(100dvh - 80px - var(--safe-top) - var(--safe-bottom)));
        overflow: auto;
        overscroll-behavior: contain;
      }
      .panel.is-open { display: block; }
      .panel h2 { font-size: 24px; margin-bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="notice" id="notice" hidden></div>
  <button type="button" id="panel-toggle" aria-expanded="false" aria-controls="panel">Controls</button>
  <aside class="panel" id="panel" aria-label="Headlamp controls">
    <p class="eyebrow">001 · after dark</p>
    <h2>Hi-Vis</h2>
    <label>
      <span>retroreflectivity <output id="retro-out">1.00</output></span>
      <input id="retro" type="range" min="0" max="1" step="0.01" value="1" />
    </label>
    <label>
      <span>headlamp offset <output id="offset-out">0.00 m</output></span>
      <input id="offset" type="range" min="0" max="2.5" step="0.01" value="0" />
    </label>
    <label>
      <span>bloom <output id="bloom-out">0.08</output></span>
      <input id="bloom" type="range" min="0" max="1.5" step="0.01" value="0.08" />
    </label>
    <p class="hint">Drag or move to aim the beam. Tap or click to flash. Offset slides the lamp off the camera — the return should die while the pool of light remains.</p>
  </aside>
  <div class="hud">
    <a href="/">← sketches</a>
    <span>001 · hi-vis after dark · <span id="backend">…</span></span>
  </div>

  <script>
    if (!window.HTMLScriptElement || !HTMLScriptElement.supports || !HTMLScriptElement.supports('importmap')) {
      const notice = document.getElementById('notice');
      const backend = document.getElementById('backend');
      notice.textContent = 'This browser cannot load the sketch. Import maps are unsupported, so neither WebGPU nor the WebGL2 fallback can start.';
      notice.hidden = false;
      if (backend) backend.textContent = 'unsupported';
    }
  </script>
  <script type="module">
    const notice = document.getElementById('notice');
    const backendLabel = document.getElementById('backend');
    const say = (msg) => { notice.textContent = msg; notice.hidden = false; };
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FAIL = 'Neither WebGPU nor WebGL2 is available, so this sketch cannot run here.';

    const params = { retro: 1, offset: 0, bloom: 0.08, intensity: 190 };
    let retroUniform = null;
    const pointer = { x: 0.5, y: 0.5 };
    const smooth = { x: 0.5, y: 0.5 };
    let flashAt = -1e9;

    const panel = document.getElementById('panel');
    const toggle = document.getElementById('panel-toggle');
    const retroIn = document.getElementById('retro');
    const offsetIn = document.getElementById('offset');
    const bloomIn = document.getElementById('bloom');
    const retroOut = document.getElementById('retro-out');
    const offsetOut = document.getElementById('offset-out');
    const bloomOut = document.getElementById('bloom-out');

    retroIn.addEventListener('input', () => {
      params.retro = Number(retroIn.value);
      if (retroUniform) retroUniform.value = params.retro;
      retroOut.textContent = params.retro.toFixed(2);
    });
    offsetIn.addEventListener('input', () => {
      params.offset = Number(offsetIn.value);
      offsetOut.textContent = params.offset.toFixed(2) + ' m';
    });
    bloomIn.addEventListener('input', () => {
      params.bloom = Number(bloomIn.value);
      bloomOut.textContent = params.bloom.toFixed(2);
    });

    toggle.addEventListener('click', () => {
      const open = panel.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    // A drag steers. A tap (pointerup with almost no travel) flashes.
    // Listening on the canvas, with touch-action: none, keeps the page still.
    const TAP_PX = 12;
    let activeId = null;
    let startX = 0;
    let startY = 0;
    let moved = false;
    let canvasEl = null;

    const onUi = (event) => event.target.closest && event.target.closest('#panel, #panel-toggle, #sketch-frame, a, #notice');

    function setPointer(clientX, clientY) {
      const rect = canvasEl ? canvasEl.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: innerHeight };
      pointer.x = (clientX - rect.left) / Math.max(1, rect.width);
      pointer.y = (clientY - rect.top) / Math.max(1, rect.height);
    }

    function bindPointer(canvas) {
      canvasEl = canvas;
      canvas.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || onUi(event) || activeId !== null) return;
        activeId = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        moved = false;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (activeId === null) {
          if (event.pointerType === 'mouse') setPointer(event.clientX, event.clientY);
          return;
        }
        if (event.pointerId !== activeId) return;
        if (Math.hypot(event.clientX - startX, event.clientY - startY) > TAP_PX) moved = true;
        if (event.pointerType === 'mouse' || moved) setPointer(event.clientX, event.clientY);
      });
      const endPointer = (event) => {
        if (event.pointerId !== activeId) return;
        if (!moved) flashAt = performance.now();
        activeId = null;
      };
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', (event) => {
        if (event.pointerId === activeId) activeId = null;
      });
    }

    document.addEventListener('touchmove', (event) => {
      if (event.target.closest && event.target.closest('#panel, #panel-toggle, #sketch-frame')) return;
      event.preventDefault();
    }, { passive: false });
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(type, (event) => event.preventDefault(), { passive: false });
    }

    function viewSize() {
      const vv = window.visualViewport;
      return {
        w: Math.max(1, vv ? vv.width : innerWidth),
        h: Math.max(1, vv ? vv.height : innerHeight),
      };
    }

    function isMobilePerf() {
      const { w, h } = viewSize();
      return matchMedia('(pointer: coarse)').matches || Math.min(w, h) <= 540;
    }

    // Partial WebGPU (no adapter, or no float32 filtering) cannot run this
    // node pipeline. Do not request a device here — phones often allow one.
    async function gpuLooksUsable() {
      if (!navigator.gpu || typeof navigator.gpu.requestAdapter !== 'function') return false;
      let adapter = null;
      try {
        adapter = await Promise.race([
          navigator.gpu.requestAdapter(),
          new Promise((resolve) => setTimeout(() => resolve(null), 2000)),
        ]);
      } catch {
        return false;
      }
      if (!adapter || !adapter.features || !adapter.features.has('float32-filterable')) return false;
      return true;
    }

    function chevronGeometry(THREE) {
      const outer = 0.155;
      const inner = 0.078;
      const tip = 0.2;
      const tipIn = tip - (outer - inner) * 1.15;
      const shape = new THREE.Shape();
      shape.moveTo(0, outer);
      shape.lineTo(tip, 0);
      shape.lineTo(0, -outer);
      shape.lineTo(0, -inner);
      shape.lineTo(tipIn, 0);
      shape.lineTo(0, inner);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.02, bevelEnabled: false });
      geo.computeBoundingBox();
      const bb = geo.boundingBox;
      geo.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -bb.min.z);
      return geo;
    }

    function fontUrl() {
      const url = new URL(location.href);
      if (!url.pathname.endsWith('/')) url.pathname += '/';
      return new URL('helvetiker_bold.typeface.json', url).href;
    }

    try {
      const THREE = await import('three/webgpu');
      const { pass, uniform } = await import('three/tsl');
      const { bloom } = await import('three/addons/tsl/display/BloomNode.js');
      const { FontLoader } = await import('three/addons/loaders/FontLoader.js');
      const { TextGeometry } = await import('three/addons/geometries/TextGeometry.js');

      // r186 shipped this as `retroreflectivity` (the PR said `retroreflective`).
      // The lobe only returns light when the lamp sits next to the camera.
      retroUniform = uniform(1);
      retroUniform.value = params.retro;

      const aim = new THREE.Vector3();
      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const up = new THREE.Vector3(0, 1, 0);

      function flashGain(now) {
        const t = (now - flashAt) / 1000;
        if (t < 0 || t > 1.4) return 0;
        if (t < 0.08) return 1;
        return Math.exp(-(t - 0.08) / 0.16);
      }

      function matte(color, roughness) {
        return new THREE.MeshStandardNodeMaterial({ color, roughness, metalness: 0 });
      }

      function retro(color, roughness, specularColor, specularIntensity) {
        return new THREE.MeshPhysicalNodeMaterial({
          color,
          roughness,
          metalness: 0,
          specularColor,
          specularIntensity,
          retroreflectivityNode: retroUniform,
        });
      }

      const queryWebGL = new URLSearchParams(location.search).has('webgl');
      const mobileAtStart = isMobilePerf();
      let forceWebGL = queryWebGL || !(await gpuLooksUsable());

      function makeRenderer(force) {
        const renderer = new THREE.WebGPURenderer({
          antialias: !mobileAtStart,
          alpha: false,
          forceWebGL: force,
        });
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        const el = renderer.domElement;
        el.style.position = 'fixed';
        el.style.inset = '0';
        el.style.touchAction = 'none';
        return renderer;
      }

      let renderer = makeRenderer(forceWebGL);
      document.body.prepend(renderer.domElement);
      bindPointer(renderer.domElement);
      try {
        await renderer.init();
      } catch (err) {
        console.error(err);
        try { renderer.dispose(); } catch { /* init never finished */ }
        renderer.domElement.remove();
        if (forceWebGL) throw err;
        forceWebGL = true;
        renderer = makeRenderer(true);
        document.body.prepend(renderer.domElement);
        bindPointer(renderer.domElement);
        await renderer.init();
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(32, 1, 0.08, 40);
      scene.add(camera);

      // Barely-there sky so unlit shapes exist as silhouettes. Retroreflection
      // is direct-light only, so this fill never makes the tape blaze.
      scene.add(new THREE.HemisphereLight(0x243044, 0x000000, 0.035));

      const lamp = new THREE.SpotLight(0xfff4e2, params.intensity, 0, 0.32, 0.55, 2);
      const lampTarget = new THREE.Object3D();
      lamp.target = lampTarget;
      scene.add(lamp, lampTarget);

      const wallMat = matte(0x1a1a20, 0.94);
      const boardMat = matte(0x26262e, 0.88);
      const backingMat = matte(0x100e0c, 0.92);
      const orangeMat = matte(0x8d4318, 0.78);
      const blackMat = matte(0x0a0a0c, 0.7);

      // Dull base colours. The return itself is the specular lobe, tinted
      // white for the vinyl and fluorescent yellow for the tape.
      const vinylMat = retro(0x3a3a36, 0.32, 0xf7f7f2, 1.6);
      const tapeMat = retro(0x3c3a2a, 0.24, 0xd2ff3a, 2);
      tapeMat.side = THREE.DoubleSide;

      const wall = new THREE.Mesh(new THREE.BoxGeometry(22, 12, 0.4), wallMat);
      wall.position.set(0, 4.2, -0.2);
      scene.add(wall);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), wallMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const font = await new FontLoader().loadAsync(fontUrl());
      const textGeo = new TextGeometry('HI-VIS', {
        font,
        size: 0.68,
        depth: 0.16,
        curveSegments: 8,
        bevelEnabled: true,
        bevelThickness: 0.012,
        bevelSize: 0.008,
        bevelSegments: 2,
      });
      textGeo.computeBoundingBox();
      const bb = textGeo.boundingBox;
      const letterW = bb.max.x - bb.min.x;
      const letterH = bb.max.y - bb.min.y;
      textGeo.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -bb.min.z);

      const wordY = 1.32;
      const board = new THREE.Mesh(new THREE.BoxGeometry(letterW + 1.45, letterH + 1.2, 0.07), boardMat);
      board.position.set(0, wordY, 0.035);
      scene.add(board);

      const letters = new THREE.Mesh(textGeo, vinylMat);
      letters.position.set(0, wordY, 0.08);
      scene.add(letters);

      const tapeZ = 0.09;
      const rowOffset = letterH * 0.5 + 0.3;
      const tapeWidth = letterW + 1.05;
      for (const y of [wordY + rowOffset, wordY - rowOffset]) {
        const strip = new THREE.Mesh(new THREE.BoxGeometry(tapeWidth, 0.38, 0.014), backingMat);
        strip.position.set(0, y, tapeZ - 0.012);
        scene.add(strip);
      }

      const chevronGeo = chevronGeometry(THREE);
      const spacing = 0.25;
      const perRow = Math.max(1, Math.floor(tapeWidth / spacing));
      const chevrons = new THREE.InstancedMesh(chevronGeo, tapeMat, perRow * 2);
      const dummy = new THREE.Object3D();
      let index = 0;
      for (const y of [wordY + rowOffset, wordY - rowOffset]) {
        for (let n = 0; n < perRow; n++) {
          dummy.position.set((n - (perRow - 1) / 2) * spacing, y, tapeZ);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          chevrons.setMatrixAt(index++, dummy.matrix);
        }
      }
      chevrons.instanceMatrix.needsUpdate = true;
      scene.add(chevrons);

      for (let i = 0; i < 4; i++) {
        const dash = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.008, 0.36), vinylMat);
        dash.position.set(0, 0.006, 2.35 + i * 0.9);
        scene.add(dash);
      }

      const cone = new THREE.Group();
      cone.position.set(-1.55, 0, 1.85);
      cone.rotation.y = 0.5;
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.52), orangeMat);
      base.position.y = 0.025;
      cone.add(base);
      const bodyH = 0.9;
      const bodyBottom = 0.05;
      const radiusBottom = 0.2;
      const radiusTop = 0.028;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, bodyH, 40, 1, false), orangeMat);
      body.position.y = bodyBottom + bodyH * 0.5;
      cone.add(body);
      const radiusAt = (y) => {
        const t = THREE.MathUtils.clamp((y - bodyBottom) / bodyH, 0, 1);
        return THREE.MathUtils.lerp(radiusBottom, radiusTop, t);
      };
      for (const band of [{ center: bodyBottom + bodyH * 0.62, height: 0.09 }, { center: bodyBottom + bodyH * 0.4, height: 0.055 }]) {
        const y0 = band.center - band.height * 0.5;
        const y1 = band.center + band.height * 0.5;
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(radiusAt(y1) * 1.025, radiusAt(y0) * 1.025, band.height, 40, 1, true),
          vinylMat,
        );
        mesh.position.y = band.center;
        cone.add(mesh);
      }
      scene.add(cone);

      const sign = new THREE.Group();
      sign.position.set(1.72, 0, 1.25);
      sign.rotation.y = -0.28;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.036, 0.72, 16), blackMat);
      post.position.y = 0.36;
      sign.add(post);
      const border = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.028), blackMat);
      border.rotation.z = Math.PI / 4;
      border.position.y = 1.08;
      sign.add(border);
      const face = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.74, 0.028), tapeMat);
      face.rotation.z = Math.PI / 4;
      face.position.set(0, 1.08, 0.02);
      sign.add(face);
      const stem = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.2, 0.02), blackMat);
      stem.position.set(0, 1.12, 0.05);
      sign.add(stem);
      const dot = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.055, 0.02), blackMat);
      dot.position.set(0, 0.94, 0.05);
      sign.add(dot);
      scene.add(sign);

      const webgpu = renderer.backend.isWebGPUBackend === true;
      backendLabel.textContent = webgpu ? 'webgpu' : 'webgl2';

      const scenePass = pass(scene, camera);
      const sceneColor = scenePass.getTextureNode();
      const bloomPass = bloom(sceneColor, params.bloom, 0.22, 1);
      let bloomScale = 0.5;
      const pipeline = new THREE.RenderPipeline(renderer);
      pipeline.outputNode = sceneColor.add(bloomPass);

      function resize() {
        const { w, h } = viewSize();
        const aspect = w / h;
        // 32° is the desktop frame. Widen only when the word would otherwise
        // be cropped, which is every portrait phone.
        const dist = 7.35;
        const halfNeed = letterW * 0.5 + 0.55;
        const tanHalf = halfNeed / (dist * aspect);
        camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(2 * Math.atan(tanHalf)), 32, 68);
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
        const mobile = isMobilePerf();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2));
        renderer.setSize(w, h);
        const scale = mobile ? 0.25 : 0.5;
        if (scale !== bloomScale) {
          bloomPass.setResolutionScale(scale);
          bloomScale = scale;
        }
      }
      addEventListener('resize', resize);
      if (window.visualViewport) {
        visualViewport.addEventListener('resize', resize);
        visualViewport.addEventListener('scroll', resize);
      }
      resize();

      let last = performance.now();
      let failed = false;
      renderer.setAnimationLoop((now) => {
        if (failed) return;
        try {
          const t = now || performance.now();
          const dt = Math.min(0.05, (t - last) / 1000);
          last = t;
          const ease = reduceMotion ? 1 : 1 - Math.exp(-8 * dt);
          smooth.x += (pointer.x - smooth.x) * ease;
          smooth.y += (pointer.y - smooth.y) * ease;

          const dx = smooth.x - 0.5;
          const dy = smooth.y - 0.5;
          aim.set(dx * 7.2, wordY + dy * -3.1, 0);
          camera.position.set(dx * 0.85, 1.38 + dy * -0.5, 7.35);
          camera.lookAt(aim);
          camera.updateMatrixWorld();

          camera.getWorldDirection(forward);
          right.crossVectors(forward, up).normalize();
          lamp.position.copy(camera.position).addScaledVector(forward, 0.08).addScaledVector(right, params.offset);
          lampTarget.position.copy(aim);
          lampTarget.updateMatrixWorld();

          const flash = flashGain(t);
          lamp.intensity = params.intensity * (1 + flash * 6);
          bloomPass.strength.value = params.bloom * (1 + flash * 0.45);

          pipeline.render();
          if (!document.body.dataset.ready) document.body.dataset.ready = webgpu ? 'webgpu' : 'webgl2';
        } catch (err) {
          failed = true;
          console.error(err);
          renderer.setAnimationLoop(null);
          say(FAIL + (err && err.message ? ' (' + err.message + ')' : ''));
          backendLabel.textContent = 'unsupported';
        }
      });
    } catch (err) {
      console.error(err);
      say(FAIL + (err && err.message ? ' (' + err.message + ')' : ''));
      backendLabel.textContent = 'unsupported';
    }
  </script>
  <script src="/shared/frame.js"></script>
</body>
